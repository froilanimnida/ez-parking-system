<!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <title>Your One-Time Password</title>
                        <link rel="preconnect" href="https://fonts.googleapis.com">
                        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
                        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
                        <style>
                            body {
                                font-family: 'Inter', sans-serif;
                                font-size: 16px;
                                line-height: 1.5;
                                color: #333;
                                margin: 0;
                                padding: 0;
                                background-color: #f4f4f4;
                                max-width: 100%;
                                height: 100%;
                            }
                            .container {
                                margin: 0 auto;
                                max-width: 600px;
                                text-align: center;
                                padding: 20px;
                            }
                            h1 {
                                font-weight: 700;
                                margin-bottom: 20px;
                                color: #4F46E5;
                            }
                            p {
                                margin-bottom: 20px;
                            }
                            .otp {
                                font-size: 24px;
                                font-weight: 700;
                                color: #4F46E5;
                                background-color: #C0BEE7;
                                padding: 10px;
                                display: inline-block;
                                border-radius: 8px;
                            }
                            .header {
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                margin-bottom: 20px;
                                background-color: #4F46E5;
                            }
                            .header h1 {
                                color: #ffffff;
                            }
                            .subtitle {
                                font-size: 16px;
                                font-weight: 700;
                                color: #4F46E5;
                                text-align: center;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="container">
                            <div class="header">
                                <h1>Ez Parking</h1>
                            </div>
                            <p class="subtitle">Your One-Time PIN</p>
                            <p>This OTP will expire in 5 minutes.</p>
                            <p class="otp">{{ otp }}</p>
                            <p>You're receiving this email because you requested a one-time password to log in to your account. If you did not request this OTP, please ignore this email.</p>
                            <div style="background-color: #4F46E5; color: #ffffff; padding: 30px 10px;">
                                <p style="text-align: center; margin: 0;">&copy; 2025 Ez Parking. All rights reserved.</p>
                            </div>
                        </div>
                    </body>
                    </html>
